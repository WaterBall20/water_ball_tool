[package]
name = "water_ball_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
indicatif = "0.18.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rand = "0.10.3"
blake3 = "1.8.7"
#AI=== binrw 二进制序列化依赖（Attribute 等 on-disk 结构）/ binrw binary serialization dependency (on-disk structs like Attribute)
binrw = "0.15.2"
#AI_END===
clap = { version = "4.6.7", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
blake2b_simd = "1.0.5"
md-5 = "0.11.0"
crc32fast = "1.5.2"

[dev-dependencies]
pretty_assertions = "1.4.1"
