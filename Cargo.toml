[package]
name = "water_ball_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
sysinfo = "0.39.3"
indicatif = "0.18.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rand = "0.10.1"
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

