[workspace]
resolver = "3"
members = ["water_ball_tool_lib"]


[workspace.package]
version = "0.1.0"
authors = ["WaterBall20"]
description = "水球工具，个人开发的专门用于长期学习练习的项目"
documentation = "https://github.com/WaterBall20/water_ball_tool"

[workspace.dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
indicatif = "0.18.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rand = "0.10.3"
crossbeam-channel = "0.5.17"
#AI=== binrw 二进制序列化依赖（Attribute 等 on-disk 结构）/ binrw binary serialization dependency (on-disk structs like Attribute)
binrw = "0.15.2"
#AI_END===
clap = { version = "4.6.7", features = ["derive"] }
#Hash
blake3 = "1.8.7"
sha1 = "0.11.0"
sha2 = "0.11.1"
blake2b_simd = "1.0.5"
md-5 = "0.11.0"
crc32fast = "1.5.2"
lofty = "0.25.4"
pretty_assertions = "1.4.1"
colored = "3.1.1"
#Audio
cpal = "0.18.2"
symphonia = { version = "0.6.1", features = ["default"] }
rubato = "5.0.1"

#TUI
ratatui = "0.30.2"


[profile.release]
debug = true


# package
[package]
name = "water_ball_tool"
edition = "2024"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true

[dependencies]
water_ball_tool_lib = { path = "./water_ball_tool_lib" }
serde_json = { workspace = true }
indicatif = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
blake3 = { workspace = true }

clap = { workspace = true }
#Hash
sha1 = { workspace = true }
sha2 = { workspace = true }
blake2b_simd = { workspace = true }
md-5 = { workspace = true }
crc32fast = { workspace = true }

colored = { workspace = true }
#Audio
lofty = { workspace = true }
cpal = { workspace = true }
symphonia = { workspace = true, features = ["aac", "mp3", "mkv", "flac"] }
rubato = { workspace = true }
ratatui = { workspace = true }
crossbeam-channel = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
