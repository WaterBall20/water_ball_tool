[package]
name = "water_ball_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
indicatif = "0.18.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rand = "0.10.2"
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
