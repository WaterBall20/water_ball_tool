[workspace]
resolver = "3"
members = ["water_ball_tool_lib"]


[workspace.package]
version = "0.1.0"
authors = ["WaterBall20"]
description = "水球工具，个人开发的专门用于长期学习练习的项目"
documentation = "https://github.com/WaterBall20/water_ball_tool"

[workspace.dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
#日志和进度条
indicatif = "0.18.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
chrono = "0.4.45"
directories = "6.0"
thread-priority = "3.1.1"
windows-sys = "0.61.2"
winapi = "0.3.9"
libc = "0.2.191"

rand = "0.10.3"
crossbeam-utils = "0.8.23"
crossbeam-channel = "0.5.17"
#AI=== binrw 二进制序列化依赖（Attribute 等 on-disk 结构）/ binrw binary serialization dependency (on-disk structs like Attribute)
binrw = "0.15.2"
#AI_END===
clap = { version = "4.6.7", features = ["derive"] }
#Hash
blake3 = "1.8.7"
sha1 = "0.11.0"
sha2 = "0.11.1"
blake2b_simd = "1.0.5"
md-5 = "0.11.0"
crc32fast = "1.5.2"
lofty = "0.25.4"
pretty_assertions = "1.4.1"
colored = "3.1.1"
#Audio
cpal = "0.18.2"
symphonia = { version = "0.6.1", features = ["default"] }
rubato = "5.0.1"

#TUI
ratatui = "0.30.2"
unicode-width = "0.2.2"

[profile.release]
debug = true
strip = "none"
lto = "fat"
codegen-units = 4  # 与 fat LTO 搭配，规避潜在的性能回退

# package
[package]
name = "water_ball_tool"
edition = "2024"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true

[dependencies]
water_ball_tool_lib = { path = "./water_ball_tool_lib" }
serde_json = { workspace = true }
thread-priority = { workspace = true }
sysinfo = { workspace = true }
#日志和进度条
indicatif = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
directories = { workspace = true }

rand = { workspace = true }

clap = { workspace = true }
#Hash
blake3 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
blake2b_simd = { workspace = true }
md-5 = { workspace = true }
crc32fast = { workspace = true }

colored = { workspace = true }
#AI=== 音频引擎已移入库包，二进制包只保留 lofty 读标签 / audio engine moved to the library; only lofty stays for tag reading
lofty = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
#AI_END===
#AI=== Windows VT 输入解析（SGR 鼠标/方向键），替代 crossterm 控制台鼠标记录
# Windows VT input parsing (SGR mouse/arrows) instead of crossterm console mouse records
vtparse = "0.7"
#AI_END===

[target.'cfg(windows)'.dependencies]
#AI=== 打开 ENABLE_VIRTUAL_TERMINAL_INPUT / enable ENABLE_VIRTUAL_TERMINAL_INPUT
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
#AI_END===

[dev-dependencies]
pretty_assertions = { workspace = true }


[features]
#AI=== 音频引擎移入库包，该开关转发给库包 / the audio engine moved to the library; forward the switch
debug-no-audio = ["water_ball_tool_lib/debug-no-audio"]
#AI_END===